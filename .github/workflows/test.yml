name: Node.js CI (BM Kurir API Testing)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: 1. Checkout GitHub Repository
      uses: actions/checkout@v4

    - name: 2. Setup Lingkungan Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: 3. Install Dependensi Node di folder Server
      run: npm install
      working-directory: ./server

    - name: 4. Jalankan Skrip Otomasi Pengujian (Jest) di folder Server
      run: npm test --if-present
      working-directory: ./server
      env:
        NODE_ENV: test
        MONGO_URI_TEST: mongodb://localhost:27017/bm_kurir_testing